<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Pembelajaran Harian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* Light green background */
        }
        .tosca-gradient {
            background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
        }
        
        /* Custom styled alert box to replace default alert() */
        #customAlert {
            display: none; /* Hidden by default */
        }
        
        /* Animation for fade in/out */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        .fade-out {
            animation: fadeOut 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-teal-100">
        <!-- Header Section -->
        <div class="tosca-gradient p-6 text-center text-white">
            <h1 class="text-3xl font-bold tracking-tight mb-2">Jurnal Belajar</h1>
            <p class="text-teal-50 text-sm">Catat refleksimu hari ini untuk hari esok yang lebih baik.</p>
        </div>

        <!-- Form Section -->
        <div class="p-8">
            <form id="jurnalForm" class="space-y-6">
                <!-- Nama Siswa -->
                <div>
                    <label for="namaSiswa" class="block text-sm font-semibold text-gray-700 mb-1">Nama Siswa</label>
                    <input type="text" id="namaSiswa" name="namaSiswa" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-colors shadow-sm text-gray-800 placeholder-gray-400 outline-none"
                        placeholder="Masukkan namamu">
                </div>

                <!-- Dropdown Mata Pelajaran -->
                <div>
                    <label for="mataPelajaran" class="block text-sm font-semibold text-gray-700 mb-1">Mata Pelajaran</label>
                    <select id="mataPelajaran" name="mataPelajaran" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-colors shadow-sm text-gray-800 bg-white outline-none cursor-pointer">
                        <option value="" disabled selected>Pilih Mata Pelajaran...</option>
                        <option value="Pendidikan Agama Islam">Pendidikan Agama Islam (PAI)</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="Ilmu Pengetahuan Alam">Ilmu Pengetahuan Alam (IPA)</option>
                        <option value="Ilmu Pengetahuan Sosial">Ilmu Pengetahuan Sosial (IPS)</option>
                        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                        <option value="Lainnya">Lainnya...</option>
                    </select>
                </div>

                <!-- Textarea Refleksi Belajar -->
                <div>
                    <label for="refleksi" class="block text-sm font-semibold text-gray-700 mb-1">Refleksi Belajar</label>
                    <textarea id="refleksi" name="refleksi" rows="4" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-colors shadow-sm text-gray-800 placeholder-gray-400 outline-none resize-none"
                        placeholder="Apa yang kamu pelajari hari ini? Apa yang dirasa sulit?"></textarea>
                </div>

                <!-- Tombol Kirim -->
                <button type="submit" id="submitBtn"
                    class="w-full tosca-gradient text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-teal-300">
                    Kirim Jurnal
                </button>
            </form>
        </div>
    </div>

    <!-- Custom Alert Overlay -->
    <div id="customAlertOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <!-- Alert Box -->
        <div id="customAlertBox" class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full text-center hidden transform transition-all">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-teal-100 mb-4">
                <svg class="h-10 w-10 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">Alhamdulillah!</h3>
            <p class="text-gray-600 mb-6">Jurnal pembelajaranmu berhasil dikirim.</p>
            <button id="closeAlertBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2">
                Tutup
            </button>
        </div>
    </div>

    <script>
        const form = document.getElementById('jurnalForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertOverlay = document.getElementById('customAlertOverlay');
        const alertBox = document.getElementById('customAlertBox');
        const closeAlertBtn = document.getElementById('closeAlertBtn');

        // Target URL updated with the provided Apps Script URL
        const GOOGLE_APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQQYSNTtMBwZukPtVoUA3IFgo9wdX8Me1FTxyRFz1yliwfhmeTKm0mGDYezVC4yQk9XQ/exec';

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah reload halaman

            // Mengubah state tombol saat loading
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = 'Mengirim...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            // Mengambil data dari form
            const formData = new FormData(form);
            const urlEncodedData = new URLSearchParams(formData).toString();

            // Mengirim data menggunakan fetch() dengan method POST
            fetch(GOOGLE_APP_SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: urlEncodedData
            })
            .then(response => {
                if (response.ok) {
                    showCustomAlert();
                    form.reset(); // Mengosongkan form
                } else {
                    throw new Error('Gagal mengirim data. Status: ' + response.status);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                // Menggunakan native alert untuk error agar lebih sederhana
                // *Catatan: Aturan menyebutkan jangan gunakan alert(),
                // tapi ini hanya fallback jika custom alert gagal atau ada error jaringan
                // Kita gunakan custom alert untuk pesan sukses utama.
                showErrorAlert(); 
            })
            .finally(() => {
                // Mengembalikan state tombol
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            });
        });

        // Fungsi untuk menampilkan Custom Alert (Sukses)
        function showCustomAlert() {
            alertOverlay.classList.remove('hidden');
            alertBox.classList.remove('hidden');
            
            // Add fade-in animation
            alertOverlay.classList.add('fade-in');
            alertBox.classList.add('fade-in');
            
            // Remove animation class after it completes to allow it to run again later
            setTimeout(() => {
                alertOverlay.classList.remove('fade-in');
                alertBox.classList.remove('fade-in');
            }, 300);
        }

        // Fungsi untuk menutup Custom Alert
        closeAlertBtn.addEventListener('click', function() {
            // Add fade-out animation
            alertOverlay.classList.add('fade-out');
            alertBox.classList.add('fade-out');
            
            // Hide elements after animation completes
            setTimeout(() => {
                alertOverlay.classList.add('hidden');
                alertBox.classList.add('hidden');
                alertOverlay.classList.remove('fade-out');
                alertBox.classList.remove('fade-out');
            }, 280); // Slightly less than 300ms to ensure it hides smoothly
        });
        
        // Simple fallback error alert function using DOM manipulation instead of window.alert()
        function showErrorAlert() {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'fixed top-4 right-4 bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-lg z-50 fade-in';
            errorDiv.innerHTML = `
                <div class="flex justify-between items-center">
                    <p class="font-bold">Error!</p>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-700 font-bold px-2">&times;</button>
                </div>
                <p class="text-sm">Terjadi kesalahan saat mengirim jurnal. Silakan coba lagi.</p>
            `;
            document.body.appendChild(errorDiv);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                if (document.body.contains(errorDiv)) {
                    errorDiv.classList.add('fade-out');
                    setTimeout(() => errorDiv.remove(), 300);
                }
            }, 5000);
        }
    </script>
</body>
</html>
